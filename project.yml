# XcodeGen spec (https://github.com/yonaskolb/XcodeGen) -- generates
# maciOS.xcodeproj from this file rather than hand-authoring pbxproj XML,
# which nobody in this project has had a working Xcode to validate. CI
# (.github/workflows/build.yml) runs `xcodegen generate` then builds this
# for the iOS Simulator on every push, with code signing disabled, so a
# breakage in port/ or process-host/ shows up as a real Apple-toolchain
# compile error instead of staying an unverified guess. See AUDIT.md
# section 4 and docs/xcode-setup.md / docs/process-host.md for what this
# does and doesn't prove (compiles against the real SDK; does not confirm
# on-device behavior, entitlement/extension-launch semantics, or the
# process-host mechanism actually getting a separate PID -- simulator
# builds don't exercise any of that).

name: maciOS
options:
  bundleIdPrefix: dev.local.maciOS
  deploymentTarget:
    iOS: "15.0"

configs:
  Debug: debug
  Release: release

targets:
  MaciOSPortApp:
    type: application
    platform: iOS
    sources:
      - path: port/MaciOSPortApp
      - path: port/CLICore
      # Pre-built by test-payload/build-and-patch.sh, which MUST run
      # before `xcodegen generate` (see .github/workflows/build.yml) --
      # this is the real M2 test artifact: a macOS-compiled binary,
      # patched by tools/macho_patch.py, embedded here as a raw Copy
      # Files target rather than compiled by Xcode from source at all
      # (unlike TestPayload below, which Xcode compiles directly for iOS
      # as a control). Xcode's own "Code Sign On Copy" (default for the
      # Frameworks destination) covers its signature the same way it
      # covers everything else in the bundle -- see AUDIT.md section 2.
      - path: test-payload/PatchedMacOSPayload.dylib
        buildPhase:
          copyFiles:
            destination: frameworks
    info:
      path: port/MaciOSPortApp/Info.plist
      properties:
        CFBundleDisplayName: MaciOSPortApp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.maciOS.PortApp
        SWIFT_OBJC_BRIDGING_HEADER: port/MaciOSPortApp/MaciOSPortApp-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: ProcessHost
        embed: true
      - target: TestPayload
        embed: true

  TestPayload:
    # A real Xcode-built dylib (packaged as a framework, iOS's normal
    # embeddable-dynamic-library shape) for process-host/ to dlopen at
    # runtime -- see test-payload/TestPayload.c for why this is separate
    # from the tools/macho_patch.py pipeline.
    type: framework
    platform: iOS
    sources:
      # Exactly this one file, not the whole test-payload/ directory --
      # that directory also holds build-and-patch.sh and the *other*
      # payload (PatchedMacOSPayload.dylib, embedded separately above),
      # neither of which Xcode should try to compile as a source.
      - path: test-payload/TestPayload.c
    info:
      path: test-payload/Info.plist
      properties:
        CFBundleDisplayName: TestPayload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.maciOS.TestPayload
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEFINES_MODULE: NO
        SKIP_INSTALL: NO

  ProcessHost:
    type: app-extension
    platform: iOS
    sources:
      - path: process-host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.maciOS.PortApp.ProcessHost
        INFOPLIST_FILE: process-host/Info.plist
        CODE_SIGN_ENTITLEMENTS: process-host/ProcessHost.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
