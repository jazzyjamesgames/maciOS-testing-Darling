name: build

# Compiles port/ and process-host/ against the real Apple SDK on a macOS
# runner -- something no environment used to develop this repo so far has
# been able to do. Two builds:
#
#   1. iOS Simulator, code signing disabled -- fast compile check (Swift/
#      Objective-C syntax, Info.plist schema, the app-extension target
#      wiring). This is what caught the "Embedded binary's bundle
#      identifier is not prefixed with the parent app's bundle identifier"
#      error on the first run.
#   2. Real device (iphoneos SDK, arm64), code signing disabled -- produces
#      an actual unsigned .ipa, uploaded as a workflow artifact. This is
#      the SAME shape ios18-probe's own CI produced ("Probe-unsigned.ipa"):
#      SideStore/AltStore resign an unsigned IPA themselves at install
#      time (AUDIT.md section 2), so an unsigned build is the correct
#      input, not a placeholder.
#
# Before either build, test-payload/build-and-patch.sh runs: compiles
# fixtures/macos_payload.c for arm64-apple-macos (never iOS), patches it
# with tools/macho_patch.py (platform tag + dylibify), and confirms its
# entry point survived. project.yml embeds the result
# (PatchedMacOSPayload.dylib) via a Copy Files build phase, so it has to
# exist before `xcodegen generate` runs.
#
# Neither xcodebuild step proves anything about on-device behavior,
# entitlements, or whether process-host/'s extension-launch trick actually
# works -- a compile success (simulator or device) doesn't exercise any of
# that. See AUDIT.md and docs/xcode-setup.md / docs/process-host.md for
# what still needs a real device plus SideStore.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and patch the real macOS-binary test payload
        run: ./test-payload/build-and-patch.sh

      - name: Check the patched payload's dependencies against the real iOS SDK
        run: |
          python3 tools/macho_patch.py check-deps test-payload/PatchedMacOSPayload.dylib --auto-detect-sdk
        # This is the tool M3's dependency-resolution work (MILESTONES.md,
        # docs/dependency-resolution.md) will run against a real target once
        # one is picked -- exercised here against the payload this CI already
        # builds (which links /usr/lib/libSystem.B.dylib after the -lSystem
        # fix) so the tool itself is proven against a real SDK on every push,
        # not just this repo's own offline/synthetic tests.

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (compile check)
        run: |
          xcodebuild build \
            -project maciOS.xcodeproj \
            -scheme MaciOSPortApp \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build for a real device, unsigned (for SideStore to sign at install)
        run: |
          xcodebuild build \
            -project maciOS.xcodeproj \
            -scheme MaciOSPortApp \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath DerivedData-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package the unsigned .app as an .ipa
        run: |
          APP="DerivedData-device/Build/Products/Debug-iphoneos/MaciOSPortApp.app"
          test -d "$APP" || { echo "::error::built .app not found at $APP"; find DerivedData-device/Build/Products -maxdepth 3; exit 1; }
          mkdir -p ipa_root/Payload
          cp -R "$APP" ipa_root/Payload/
          (cd ipa_root && zip -qr ../MaciOSPortApp-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaciOSPortApp-unsigned-ipa
          path: MaciOSPortApp-unsigned.ipa
          if-no-files-found: error
